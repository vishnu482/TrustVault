
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TrustVault</title>

    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #f6f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            padding: 25px 15px;
            box-sizing: border-box;
        }

        .auth-container {
            width: 420px;
            max-width: 100%;
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo h1 {
            margin: 0;
            color: #192238;
            font-size: 28px;
        }

        .auth-logo p {
            color: #7b8497;
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #192238;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #dfe3ec;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #4b5fe3;
        }

        .login-btn {
            width: 100%;
            border: none;
            background: #4b5fe3;
            color: white;
            padding: 13px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #3d50d0;
        }

        .error-message {
            background: #fff0f1;
            color: #c34b59;
            border: 1px solid #f0c7cc;
            padding: 11px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .create-link {
            text-align: center;
            margin-top: 22px;
            color: #7b8497;
        }

        .create-link a {
            color: #4b5fe3;
            text-decoration: none;
            font-weight: 700;
        }

        .admin-link {
            text-align: center;
            margin-top: 18px;
        }

        .admin-link a {
            color: #192238;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .demo-section {
            margin-top: 28px;
            border-top: 1px solid #e8eaf0;
            padding-top: 22px;
        }

        .demo-section h3 {
            text-align: center;
            color: #192238;
            font-size: 17px;
            margin: 0 0 6px;
        }

        .demo-description {
            text-align: center;
            color: #7b8497;
            font-size: 13px;
            margin: 0 0 16px;
        }

        .demo-card {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            text-align: left;
            background: #fff;
            border: 1px solid #dfe3ec;
            border-radius: 9px;
            padding: 13px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .demo-card:hover {
            border-color: #4b5fe3;
            background: #f7f8ff;
        }

        .demo-card.selected {
            border-color: #4b5fe3;
            background: #f0f2ff;
        }

        .demo-card strong {
            display: block;
            color: #192238;
            font-size: 14px;
        }

        .demo-card small {
            display: block;
            color: #7b8497;
            margin-top: 4px;
            font-size: 12px;
        }

        .demo-card .select-label {
            color: #4b5fe3;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="auth-container">

    <div class="auth-logo">
        <h1>TrustVault</h1>
        <p>Secure Document Management</p>
    </div>

    {% if error %}
    <div class="error-message">
        {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login">

        <div class="form-group">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
            >
        </div>

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>

    <div class="demo-section">

        <h3>Try TrustVault Demo</h3>

        <p class="demo-description">
            Select an account to continue.
        </p>

        <!-- Demo Admin -->
        <button
            type="button"
            class="demo-card"
            data-username="demo_admin"
            data-password="DemoAdmin@123"
            data-role="administrator"
        >
            <span>
                <strong>Admin</strong>
                <small>Demo Admin</small>
            </span>

            <span class="select-label">Select →</span>
        </button>

        <!-- Demo Owner -->
        <button
            type="button"
            class="demo-card"
            data-username="demo_owner"
            data-password="DemoOwner@123"
            data-role="document_owner"
        >
            <span>
                <strong>Vishal</strong>
                <small>Demo Owner</small>
            </span>

            <span class="select-label">Select →</span>
        </button>

        <!-- Demo Viewer -->
        <button
            type="button"
            class="demo-card"
            data-username="demo_viewer"
            data-password="DemoViewer@123"
            data-role="viewer"
        >
            <span>
                <strong>Rahul</strong>
                <small>Demo Viewer</small>
            </span>

            <span class="select-label">Select →</span>
        </button>

    </div>

    <div class="create-link">
        Don't have an account?
        <a href="/register">Create Account</a>
    </div>

    <div class="admin-link">
        <a href="/admin/login">Administrator Login</a>
    </div>

</div>

<script>
    const demoCards = document.querySelectorAll(".demo-card");

    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");

    demoCards.forEach(card => {

        card.addEventListener("click", function () {

            const username = this.dataset.username;
            const password = this.dataset.password;
            const role = this.dataset.role;

            // Demo Admin opens the separate administrator login page.
            if (role === "administrator") {
                window.location.href = "/admin/login?demo=1";
                return;
            }

            // Owner and Viewer fill the normal login form.
            usernameInput.value = username;
            passwordInput.value = password;

            demoCards.forEach(item => {
                item.classList.remove("selected");
            });

            this.classList.add("selected");

            usernameInput.focus();
        });

    });
</script>

</body>
</html>
