<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - TrustVault</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            background: #f6f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .auth-container {
            width: 420px;
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo h1 {
            margin: 0;
            color: #192238;
            font-size: 28px;
        }

        .auth-logo p {
            color: #7b8497;
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #192238;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #dfe3ec;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #4b5fe3;
        }

        .login-btn {
            width: 100%;
            border: none;
            background: #4b5fe3;
            color: white;
            padding: 13px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #3d50d0;
        }

        .error-message {
            background: #fff0f1;
            color: #c34b59;
            border: 1px solid #f0c7cc;
            padding: 11px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .create-link {
            text-align: center;
            margin-top: 22px;
            color: #7b8497;
        }

        .create-link a {
            color: #4b5fe3;
            text-decoration: none;
            font-weight: 700;
        }

        .admin-link {
            text-align: center;
            margin-top: 18px;
        }

        .admin-link a {
            color: #192238;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

    </style>

</head>


<body>

    <div class="auth-container">

        <div class="auth-logo">

            <h1>TrustVault</h1>

            <p>Secure Document Management</p>

        </div>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="post"
            action="/login"
        >

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>

        </form>


        <div class="create-link">

            Don't have an account?

            <a href="/register">
                Create Account
            </a>

        </div>


        <div class="admin-link">

            <a href="/admin/login">
                Administrator Login
            </a>

        </div>

    </div>

</body>

</html>
